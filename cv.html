<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV — María Paulina Villegas</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); font-style: normal; }
    @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-style: italic; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    :root { --ink: #121413; --ink-2: #3c403e; --muted: #737875; --line: #dcdedb; --side: #eff0ee; --accent: #0b6b4f; --serif: "Instrument Serif", Georgia, serif; --sans: "Inter", Arial, sans-serif; }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #d9dbd8; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; gap: 10px; padding: 14px; background: rgba(227,228,226,.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,.06); font-size: 14px; }
    .bar a, .bar button { font: inherit; display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(0,0,0,.12); background: rgba(255,255,255,.6); color: var(--ink); cursor: pointer; text-decoration: none; }
    .bar .primary { background: var(--accent); color: #fff; border-color: transparent; }
    .sheet { width: 210mm; height: 297mm; margin: 28px auto; background: #fff; box-shadow: 0 30px 80px -30px rgba(0,0,0,.35); display: grid; grid-template-columns: 66mm 1fr; overflow: hidden; }
    aside { background: var(--side); padding: 16mm 8mm 12mm 11mm; display: flex; flex-direction: column; gap: 7.5mm; }
    main { padding: 14mm 13mm 10mm 10mm; }
    .name { font-family: var(--serif); font-weight: 400; font-size: 40pt; line-height: .92; letter-spacing: -.02em; margin: 0; }
    .name i { display: block; }
    .title { margin: 4mm 0 0; font-size: 8pt; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; line-height: 1.5; }
    h2 { font-size: 7.4pt; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 3mm; display: flex; align-items: center; gap: 3mm; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    aside h2::after { background: #d3d5d2; }
    p, li, dd, dt { font-size: 8.4pt; line-height: 1.45; color: var(--ink-2); }
    p { margin: 0; }
    .contact { display: grid; gap: 1.6mm; font-size: 8.3pt; color: var(--ink-2); word-break: break-word; }
    .contact a { color: inherit; text-decoration: none; }
    .contact b { display: block; font-size: 6.8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .tools { display: grid; gap: 1.5mm; margin: 0; }
    .tools div { display: flex; justify-content: space-between; gap: 2mm; font-size: 8.4pt; border-bottom: 1px dotted #cfd1ce; padding-bottom: 1.3mm; }
    .tools span { color: var(--muted); font-size: 7.6pt; }
    .edu { display: grid; gap: 3mm; }
    .edu b { display: block; font-size: 8.8pt; color: var(--ink); font-weight: 600; }
    .edu span { display: block; font-size: 8.2pt; color: var(--ink-2); line-height: 1.45; }
    .edu em { font-style: normal; font-size: 7.8pt; color: var(--muted); }
    section + section { margin-top: 5.5mm; }
    .job { margin-bottom: 3.2mm; }
    .job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
    .job-head h3 { margin: 0; font-size: 9.6pt; font-weight: 600; }
    .job-head h3 span { font-weight: 400; color: var(--accent); }
    .job-head time { font-size: 7.8pt; color: var(--muted); white-space: nowrap; }
    ul { margin: 1.2mm 0 0; padding-left: 3.6mm; }
    li { margin: 0 0 .6mm; }
    li::marker { color: var(--accent); }
    .proj { display: grid; gap: 2.4mm; }
    .proj p b { color: var(--ink); font-weight: 600; }
    .profile { font-size: 9pt; line-height: 1.5; color: var(--ink); }
    .foot { margin-top: auto; font-family: var(--serif); font-style: italic; font-size: 13pt; color: var(--muted); }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { margin: 0; box-shadow: none; } }
    @media (max-width: 820px) { .sheet { transform-origin: top left; } }
  </style>
</head>
<body>
  <div class="bar"><a href="index.html" id="back"></a><a href="#" id="toggle"></a><a class="primary" id="dl" href="#"></a></div>
  <div class="sheet" id="sheet"></div>
  <script src="js/data.js?v=20261113132425"></script>
  <script src="js/cv-data.js?v=20261113132425"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const lang = qs.get("lang") === "en" ? "en" : "es";
    const c = CV[lang], S = SITE;
    document.documentElement.lang = lang;
    document.getElementById("back").textContent = "← " + c.back;
    document.getElementById("toggle").textContent = lang === "es" ? "English" : "Español";
    document.getElementById("toggle").href = "cv.html?lang=" + (lang === "es" ? "en" : "es");
    const dl = document.getElementById("dl"); dl.textContent = c.download; dl.href = S.cv[lang]; dl.download = S.cv[lang].split("/").pop();
    const phone = "+" + S.whatsapp.slice(0, 2) + " " + S.whatsapp.slice(2, 5) + " " + S.whatsapp.slice(5, 8) + " " + S.whatsapp.slice(8);
    document.getElementById("sheet").innerHTML = `
      <aside>
        <div><h1 class="name">María<i>Paulina</i>Villegas</h1><p class="title">${c.title}</p></div>
        <div><h2>${c.labels.contact}</h2><div class="contact">
          <div><b>${lang === "es" ? "Ubicación" : "Location"}</b>${c.location}</div>
          <div><b>WhatsApp</b><a href="https://wa.me/${S.whatsapp}">${phone}</a></div>
          <div><b>Email</b><a href="mailto:${S.email}">${S.email}</a></div>
          <div><b>LinkedIn</b><a href="${S.linkedin}">${S.linkedin.replace("https://", "")}</a></div>
          <div><b>Instagram</b><a href="https://instagram.com/${S.instagram}">@${S.instagram}</a></div>
        </div></div>
        <div><h2>${c.labels.tools}</h2><div class="tools">${c.tools.map(([a, b]) => `<div>${a}<span>${b}</span></div>`).join("")}</div></div>
        <div><h2>${c.labels.production}</h2><p>${c.production}</p></div>
        <div><h2>${c.labels.education}</h2><div class="edu">${c.education.map((e) => `<div><b>${e.name}</b><span>${e.org}</span>${e.date ? `<em>${e.date}</em>` : ""}</div>`).join("")}</div></div>
        <div class="foot">3D Jewelry Designer</div>
      </aside>
      <main>
        <section><h2>${c.labels.profile}</h2><p class="profile">${c.profile}</p></section>
        <section><h2>${c.labels.experience}</h2>${c.experience.map((j) => `
          <div class="job"><div class="job-head"><h3>${j.role} <span>· ${j.org}</span></h3><time>${j.date}</time></div>
          <ul>${j.items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`).join("")}</section>
        <section><h2>${c.labels.projects}</h2><div class="proj">${c.projects.map((p) => `<p><b>${p.name}.</b> ${p.desc}</p>`).join("")}</div></section>
        <section><h2>${c.labels.other}</h2><p>${c.other}</p></section>
      </main>`;
  </script>
</body>
</html>
